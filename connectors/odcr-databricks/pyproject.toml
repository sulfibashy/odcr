[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odcr-databricks"
version = "0.2.3.dev0"
description = "odcr connector for Databricks: installs odcr with the databricks driver."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "sulfibashy" }, { name = "odcr contributors" }]
keywords = ["data contracts", "ODCS", "data quality", "odcr", "databricks"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Database"]
dependencies = ["odcr[databricks]==0.2.3.dev0"]

[project.urls]
Homepage = "https://github.com/sulfibashy/odcr"
Documentation = "https://sulfibashy.github.io/odcr/"

[tool.setuptools]
packages = []
