[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odcr-mysql"
version = "0.2.2"
description = "odcr connector for MySQL / MariaDB: installs odcr with the mysql driver."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "sulfibashy" }, { name = "odcr contributors" }]
keywords = ["data contracts", "ODCS", "data quality", "odcr", "mysql"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Database"]
dependencies = ["odcr[mysql]==0.2.2"]

[project.urls]
Homepage = "https://github.com/sulfibashy/odcr"
Documentation = "https://sulfibashy.github.io/odcr/"

[tool.setuptools]
packages = []
