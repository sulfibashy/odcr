name: release

# Publishing uses PyPI trusted publishing (no API token). One-time setup on pypi.org:
# Account -> Publishing -> Add a pending publisher: owner sulfibashy, repository odcr,
# workflow release.yml, environment pypi.
# Release: push a tag (git tag v0.2.0 && git push origin v0.2.0). This workflow tests, builds,
# publishes to PyPI and creates the GitHub release with the changelog notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" && pytest -q
      - run: python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/p/odcr"}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist/}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "odcr $version" --notes-file notes.md
