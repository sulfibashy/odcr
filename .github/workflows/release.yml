name: release

# Publishing uses PyPI trusted publishing (no API token). One-time setup on pypi.org:
# Account -> Publishing -> Add a pending publisher: owner sulfibashy, repository odcr,
# workflow release.yml, environment pypi.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" && pytest -q
      - run: python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/p/odcr"}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
