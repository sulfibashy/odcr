name: release

# Publishing uses PyPI trusted publishing (no API token). One-time setup on pypi.org:
# Account -> Publishing -> Add a pending publisher: owner sulfibashy, repository odcr,
# workflow release.yml, environment pypi.
# Release: run this workflow manually (Actions -> release -> Run workflow) or push a tag vX.Y.Z.
# It tests, builds, publishes the version in pyproject.toml to PyPI, then creates the GitHub release
# and tag vX.Y.Z with the changelog notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" && pytest -q
      - run: python -m build && twine check --strict dist/*
      - name: Build the connector packages (odcr-postgres, odcr-snowflake, ...)
        run: |
          python scripts/build_connectors.py
          git diff --exit-code connectors || (echo "connectors/ is stale: run python scripts/build_connectors.py" && exit 1)
          for d in connectors/*/; do python -m build --outdir dist-connectors "$d"; done
          twine check --strict dist-connectors/*
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist/}
      - uses: actions/upload-artifact@v7
        with: {name: dist-connectors, path: dist-connectors/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/p/odcr"}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-connectors:
    # One PyPI project per connector; each needs a trusted publisher (same repository / workflow / environment).
    needs: publish
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/user/sulfibashy/"}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: {name: dist-connectors, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist/}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          awk -v v="$version" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "odcr $version" --notes-file notes.md
