# odcr framework configuration. Values like ${VAR} or ${VAR:-default} come from environment variables.
connections:
  postgres-dev:
    type: postgres
    host: ${PGHOST:-localhost}
    port: ${PGPORT:-5432}
    database: ${PGDATABASE:-postgres}
    user: ${PGUSER:-postgres}
    password: ${PGPASSWORD:-}
  mysql-dev:
    type: mysql
    host: ${MYSQL_HOST:-localhost}
    port: ${MYSQL_PORT:-3306}
    database: ${MYSQL_DATABASE:-odcr}
    user: ${MYSQL_USER:-root}
    password: ${MYSQL_PASSWORD:-}
  sqlserver-dev:
    type: sqlserver
    host: ${MSSQL_HOST:-localhost}
    port: 1433
    database: ${MSSQL_DATABASE:-master}
    user: ${MSSQL_USER:-sa}
    password: ${MSSQL_PASSWORD:-}

# Meta tables (runs, check results, quarantine, notifications, reconciliation, pipeline events)
# are created in this schema inside each platform the framework runs on.
meta:
  schema: odcr_meta

# What happens when a batch fails an error-level check: quarantine (log + non-zero exit) or log.
on_fail: quarantine

notifications:
  notify_on: [fail, warn]
  # The platform team is told about every failure, on every contract.
  platform_team:
    - type: console
    - type: slack
      url: ${PLATFORM_SLACK_WEBHOOK:-}
    - type: email
      to: [data-platform@example.com]
  smtp:
    host: ${SMTP_HOST:-localhost}
    port: ${SMTP_PORT:-25}
    from: odcr@example.com
