# Reconciliation: does the target hold exactly what the source sent, for this batch?
# Source and target can be on different platforms (e.g. PostgreSQL -> MySQL).
kind: Reconciliation
id: orders-postgres-to-mysql
contract: orders
source:
  connection: postgres-dev
  object: public.orders
  where: "load_id = '{batch_id}'"      # {batch_id} is replaced at run time; remove for full-table checks
target:
  connection: mysql-dev
  object: orders
  where: "load_id = '{batch_id}'"
checks:
  - type: rowCount
  - type: sum
    column: amount
    tolerance: 0.01                    # absolute; or tolerancePercent: 0.1
  - type: distinctCount
    column: customer_id
  - type: missingKeys
    column: order_id
