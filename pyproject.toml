[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odcr"
version = "0.2.2.dev0"
description = "Open Data Contract Runtime: enforce ODCS data contracts where data lands, reconcile source and target, and trace every batch end to end, on any database, lake or cloud."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sulfibashy" }, { name = "odcr contributors" }]
maintainers = [{ name = "sulfibashy" }]
keywords = ["data contracts", "ODCS", "data quality", "data observability", "reconciliation", "data engineering",
            "databricks", "snowflake", "bigquery", "duckdb", "sql server", "mongodb", "adls"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]
files = ["duckdb>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
sqlserver = ["pyodbc>=5.0", "python-tds>=1.15"]
synapse = ["pyodbc>=5.0", "python-tds>=1.15"]
fabric = ["pyodbc>=5.0", "python-tds>=1.15"]
oracle = ["oracledb>=2.0"]
db2 = ["ibm_db>=3.2"]
trino = ["trino>=0.330"]
snowflake = ["snowflake-connector-python>=3.6"]
databricks = ["databricks-sql-connector>=3.1"]
bigquery = ["google-cloud-bigquery>=3.17"]
redshift = ["redshift_connector>=2.1"]
athena = ["PyAthena>=3.0"]
mongodb = ["pymongo>=4.6"]
cosmosdb = ["azure-cosmos>=4.5", "azure-identity>=1.15"]
lint = ["datacontract-cli>=0.10"]
keyring = ["keyring>=24"]
microsoft365 = ["azure-identity>=1.15"]
aws-ses = ["boto3>=1.34"]
all = [
  "duckdb>=1.1", "psycopg[binary]>=3.1", "PyMySQL>=1.1", "pyodbc>=5.0", "python-tds>=1.15", "oracledb>=2.0",
  "trino>=0.330", "snowflake-connector-python>=3.6", "databricks-sql-connector>=3.1", "google-cloud-bigquery>=3.17",
  "redshift_connector>=2.1", "PyAthena>=3.0", "pymongo>=4.6", "azure-cosmos>=4.5", "azure-identity>=1.15",
  "keyring>=24", "boto3>=1.34",
]
dev = [
  "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "twine>=5",
  "duckdb>=1.1", "psycopg[binary]>=3.1", "PyMySQL>=1.1", "python-tds>=1.15", "oracledb>=2.0", "trino>=0.330",
  "pymongo>=4.6", "mongomock>=4.1", "keyring>=24",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/sulfibashy/odcr"
Documentation = "https://sulfibashy.github.io/odcr/"
Repository = "https://github.com/sulfibashy/odcr"
Issues = "https://github.com/sulfibashy/odcr/issues"
Changelog = "https://github.com/sulfibashy/odcr/blob/main/CHANGELOG.md"

[project.scripts]
odcr = "odcr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odcr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: end-to-end tests against a live database (skipped when the database is not reachable)",
]
filterwarnings = ["ignore::DeprecationWarning:mongomock.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP007", "UP045"]

[tool.coverage.run]
source = ["odcr"]
branch = true

[tool.coverage.report]
skip_empty = true
